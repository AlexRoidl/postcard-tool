<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Print Queue</title>
<link rel="stylesheet" href="style.css" />
<style>
  body { overflow: auto; padding: 18px 16px 48px; }

  /* tiny, unobtrusive live status — no headline */
  #bar { font-size: 11px; color: var(--muted); font-weight: 400; margin: 0 0 16px;
         display: flex; align-items: center; gap: 8px; }
  #bar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); display: inline-block; }
  #bar a { color: var(--muted); }
  #bar .err { color: var(--err); }

  /* gallery: borderless masonry */
  #gallery { column-width: 230px; column-gap: 16px; }
  .item { break-inside: avoid; margin: 0 0 18px; }
  .pic { position: relative; line-height: 0; }
  .pic img { width: 100%; display: block; }         /* no border */
  .item.done .pic img { opacity: .5; }               /* printed ones recede */

  .badge { position: absolute; top: 7px; right: 7px; font-size: 11px; font-weight: 700;
           padding: 1px 7px; line-height: 1.5; }
  .badge.ok { background: var(--mint); color: var(--ink); }
  .badge.go { background: var(--ink); color: #fff; }
  .badge.bad { background: var(--err); color: #fff; }

  /* hover overlay: status + actions */
  .ov { position: absolute; inset: 0; display: flex; align-items: flex-end;
        opacity: 0; transition: opacity .12s; }
  .pic:hover .ov { opacity: 1; }
  .ov .inner { width: 100%; background: rgba(32,0,16,.84); color: #fff;
               display: flex; align-items: center; justify-content: space-between;
               gap: 8px; padding: 8px 10px; font-size: 12px; }
  .ov .st { font-weight: 400; opacity: .85; }
  .ov .acts { display: flex; gap: 6px; }
  .ov button { font: 700 12px var(--font); background: #fff; color: var(--ink);
               border: none; padding: 6px 12px; cursor: pointer; }
  .ov button:hover { background: var(--mint); }
  .ov button.rej { background: transparent; color: #fff; padding: 6px 4px; }
  .ov button.rej:hover { color: var(--err); background: transparent; }

  .nm { font-size: 11px; color: var(--muted); text-align: center; padding: 5px 2px 0; font-weight: 700; }
  #empty { color: var(--muted); font-weight: 400; font-size: 13px; }
</style>
</head>
<body>
  <div id="bar"><span class="dot"></span><span id="status">connecting…</span> · <a href="#" id="reauth">token</a></div>
  <div id="gallery"><span id="empty">no postcards yet</span></div>

<script>
const $ = s => document.querySelector(s);
let token = localStorage.getItem('admin_token') || '';
const hdr = () => token ? { 'x-print-token': token } : {};
let lastKey = '';

$('#reauth').onclick = e => {
  e.preventDefault();
  const t = (prompt('Admin token (leave blank if none):') || '').trim();
  token = t;
  if (t) localStorage.setItem('admin_token', t); else localStorage.removeItem('admin_token');
  lastKey = ''; poll();
};

const ago = ts => { const s = Math.round((Date.now()-ts)/1000); if (s<60) return s+'s'; if (s<3600) return Math.round(s/60)+'m'; return Math.round(s/3600)+'h'; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function act(id, action) { await fetch(`/api/jobs/${id}/${action}`, { method:'POST', headers: hdr() }); lastKey=''; poll(); }

function item(j) {
  const el = document.createElement('div');
  el.className = 'item ' + j.status;
  const src = `/api/jobs/${j.id}/png?token=${encodeURIComponent(token)}`;

  let badge = '';
  if (j.status === 'done') badge = '<span class="badge ok">printed ✓</span>';
  else if (j.status === 'approved') badge = '<span class="badge go">printing…</span>';
  else if (j.status === 'error') badge = '<span class="badge bad">failed</span>';

  let st = '', acts = '';
  if (j.status === 'pending')  { st = 'new · ' + ago(j.createdAt) + ' ago'; acts = `<button data-a="approve">print</button><button class="rej" data-a="reject">✕</button>`; }
  else if (j.status === 'approved') { st = 'sent to printer…'; acts = ''; }
  else if (j.status === 'done') { st = 'printed ' + ago(j.updatedAt || j.createdAt) + ' ago'; acts = `<button data-a="approve">reprint</button><button class="rej" data-a="reject">✕</button>`; }
  else if (j.status === 'error') { st = esc(j.error || 'print failed'); acts = `<button data-a="approve">retry</button><button class="rej" data-a="reject">✕</button>`; }

  el.innerHTML =
    `<div class="pic"><img src="${src}" alt="">${badge}` +
      `<div class="ov"><div class="inner"><span class="st">${st}</span><span class="acts">${acts}</span></div></div>` +
    `</div>` +
    `<div class="nm">${j.name ? esc(j.name) : '—'}</div>`;
  el.querySelectorAll('.ov button').forEach(b => b.onclick = () => act(j.id, b.dataset.a));
  return el;
}

async function poll() {
  try {
    const r = await fetch('/api/jobs', { headers: hdr() });
    if (r.status === 401) {
      token = (prompt('Admin token:') || '').trim();
      if (token) { localStorage.setItem('admin_token', token); lastKey=''; return poll(); }
      $('#status').innerHTML = '<span class="err">token required</span>'; return;
    }
    const { jobs = [] } = await r.json();
    // gallery: everything except rejected, newest first
    const show = jobs.filter(j => j.status !== 'rejected').sort((a,b) => b.createdAt - a.createdAt);
    $('#status').textContent = `${show.length} postcard${show.length===1?'':'s'} · updated ${new Date().toLocaleTimeString()}`;

    const key = show.map(j => j.id + ':' + j.status).join(',');
    if (key === lastKey) return;   // avoid rebuilding (keeps hover smooth)
    lastKey = key;

    const g = $('#gallery');
    g.innerHTML = '';
    if (!show.length) { g.innerHTML = '<span id="empty">no postcards yet</span>'; return; }
    show.forEach(j => g.appendChild(item(j)));
  } catch (e) { $('#status').innerHTML = '<span class="err">offline</span>'; }
}

poll();
setInterval(poll, 3000);
</script>
</body>
</html>
